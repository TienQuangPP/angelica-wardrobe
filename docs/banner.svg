<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f24"/>
      <stop offset="0.55" stop-color="#2b1840"/>
      <stop offset="1" stop-color="#4a2150"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ff8fc8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8fc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc1e3"/>
      <stop offset="1" stop-color="#9b6cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd2ec"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- petals -->
  <g fill="#ff9fd0">
    <ellipse cx="760" cy="60" rx="9" ry="5" transform="rotate(30 760 60)" opacity="0.55"/>
    <ellipse cx="1190" cy="70" rx="7" ry="4" transform="rotate(-20 1190 70)" opacity="0.5"/>
    <ellipse cx="1230" cy="300" rx="10" ry="5" transform="rotate(50 1230 300)" opacity="0.45"/>
    <ellipse cx="820" cy="350" rx="6" ry="3" transform="rotate(-40 820 350)" opacity="0.5"/>
    <ellipse cx="700" cy="330" rx="5" ry="3" transform="rotate(10 700 330)" opacity="0.35"/>
    <ellipse cx="1120" cy="365" rx="8" ry="4" transform="rotate(70 1120 365)" opacity="0.4"/>
  </g>

  <!-- low-poly gem under a hanger: models + wardrobe -->
  <g transform="translate(985 205)">
    <path d="M0 -112 C0 -132 22 -134 22 -118 C22 -106 10 -104 4 -96 L0 -88" fill="none" stroke="#f3e6ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-118 -40 L0 -90 L118 -40" fill="none" stroke="#f3e6ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-118 -40 L118 -40" stroke="#f3e6ff" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#2a1638" stroke-width="2" stroke-linejoin="round">
      <polygon points="-90,-20 0,-20 -45,40" fill="url(#gem)" opacity="0.95"/>
      <polygon points="0,-20 90,-20 45,40" fill="url(#gem)" opacity="0.8"/>
      <polygon points="-45,40 0,-20 45,40" fill="#ffd7ef"/>
      <polygon points="-90,-20 -45,40 0,140" fill="#b88bff"/>
      <polygon points="-45,40 45,40 0,140" fill="#e2a8ff"/>
      <polygon points="45,40 90,-20 0,140" fill="#8f5bea"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2">
      <circle cx="0" cy="40" r="150"/>
      <circle cx="0" cy="40" r="180" stroke-dasharray="4 8"/>
    </g>
  </g>

  <!-- text -->
  <text x="72" y="128" font-size="66" font-weight="700" fill="url(#title)">Angelica Wardrobe</text>
  <text x="74" y="176" font-size="23" fill="#e9dbf7">Reverse-engineering an MMO engine to rebuild its in-game</text>
  <text x="74" y="206" font-size="23" fill="#e9dbf7">fashion window as a standalone 3D app.</text>

  <g font-size="15" font-weight="600">
    <g transform="translate(74 238)">
      <rect width="164" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffb3db" stroke-opacity="0.6"/>
      <text x="82" y="22" text-anchor="middle" fill="#ffe3f2">.pck · elements.data</text>
    </g>
    <g transform="translate(250 238)">
      <rect width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffb3db" stroke-opacity="0.6"/>
      <text x="98" y="22" text-anchor="middle" fill="#ffe3f2">.ski / .bon / .stck → glTF</text>
    </g>
    <g transform="translate(458 238)">
      <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#ffb3db" stroke-opacity="0.6"/>
      <text x="75" y="22" text-anchor="middle" fill="#ffe3f2">x86 engine logic</text>
    </g>
    <g transform="translate(74 282)">
      <rect width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c9a6ff" stroke-opacity="0.6"/>
      <text x="84" y="22" text-anchor="middle" fill="#efe3ff">original DDS textures</text>
    </g>
    <g transform="translate(254 282)">
      <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c9a6ff" stroke-opacity="0.6"/>
      <text x="60" y="22" text-anchor="middle" fill="#efe3ff">three.js r160</text>
    </g>
    <g transform="translate(386 282)">
      <rect width="222" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c9a6ff" stroke-opacity="0.6"/>
      <text x="111" y="22" text-anchor="middle" fill="#efe3ff">verified against the game</text>
    </g>
  </g>

  <text x="74" y="356" font-size="16" fill="#cbb6dc">573 fashion sets  ·  2,322 skinned models  ·  3,306 original textures  ·  no game files in this repo</text>
</svg>

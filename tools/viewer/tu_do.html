<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thu thập thời trang - Kiếm Linh</title>
<style>
  /* The game's interface font: FZLiShu II (element\data\fzl2jw.ttf._rb, the copy with Vietnamese glyphs),
     cut down to Latin + Vietnamese by tools (tu_do/font/fzlishu_vn.ttf). */
  @font-face { font-family: "FZLiShuVN"; src: url("tu_do/font/fzlishu_vn.ttf") format("truetype"); font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; user-select: none;
    font: 13px "FZLiShuVN", "Times New Roman", "Noto Serif", serif; color: #fff0c2;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .t { font-weight: bold; text-shadow: 0 0 2px #30220c, 0 0 2px #30220c, 0 0 3px #30220c; }
  .small { font-size: 12px; }

  /* game dialogs: only real controls catch the mouse, the rest lets the 3D view rotate */
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui .aui-dlg { pointer-events: none; }
  #ui .aui-dlg.solid, #ui .aui-btn, #ui .aui-edit, #ui .aui-scroll, #ui .aui-card, #ui .aui-panel { pointer-events: auto; }
  .aui-scroll { overflow-y: auto !important; overflow-x: hidden !important; }
  .aui-scroll::-webkit-scrollbar { width: 8px; }
  .aui-scroll::-webkit-scrollbar-thumb { background: #8c7a52; border-radius: 4px; }
  /* collection_clothessub: folders sit 2 px left of the list box, back to back */
  .aui-folder { position: relative; width: 329px; height: 36px; cursor: pointer; margin-left: -2px; }
  .aui-folder-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .aui-folder-body { position: relative; width: 330px; margin-left: -2px; }
  .aui-page { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
  .aui-page::-webkit-scrollbar { display: none; }
  .aui-page-inner { position: relative; width: 330px; }
  .aui-track { pointer-events: auto; }
  .aui-card { position: absolute; width: 100px; height: 180px; cursor: pointer; }
  .aui-card > * { position: absolute; }
  /* the model picture fills the card down to the name bar, like the game's render target */
  .aui-card .aui-thumb { left: 0; top: 0; width: 100px; height: 164px; object-fit: cover; pointer-events: none; }
  /* names are drawn over every card: long ones run into the next card exactly like the game */
  .aui-card .card-name { pointer-events: none; }
  .aui-card .cnt { z-index: 1001; }
  .aui-card .sel { display: none; pointer-events: none; }
  .aui-card.on .sel { display: block; }
  .aui-card .aui-tag { left: 1px; top: 3px; pointer-events: none; }
  .aui-panel { position: absolute; box-sizing: border-box; }
  .aui-panel > * { position: absolute; }
  .aui-line { font-size: 12px; color: #fff3cc; text-shadow: 0 1px 1px #000; white-space: nowrap; }

  #facePanel { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); width: 520px; padding: 16px 20px;
    z-index: 8; }
  #facePanel h3 { margin: 4px 0 6px; font-size: 15px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 8px; }
  .chip { min-width: 56px; height: 26px; line-height: 26px; padding: 0 8px; text-align: center; cursor: pointer;
    background-size: 100% 100%; font-size: 12px; }
  .chip.on { outline: 2px solid #ffd76a; }
  #hairPalette { display: grid; grid-template-columns: repeat(17, 22px); gap: 4px; justify-content: center; }
  .sw { width: 22px; height: 18px; cursor: pointer; border: 1px solid #0008; }
  #toast { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); background: #000c; padding: 8px 18px;
    border: 1px solid #c9a55c; border-radius: 4px; display: none; z-index: 10; max-width: 70vw; text-align: center; }
  .modal { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 9; }
  .modal .box { width: 420px; max-height: 70vh; overflow: auto; background: #1c1710ee; border: 1px solid #c9a55c; padding: 14px; }
  .modal li { display: flex; justify-content: space-between; padding: 5px 4px; border-bottom: 1px solid #3a3020; cursor: pointer; }
  .modal li:hover { background: #3a3020; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000;
    font-size: 18px; z-index: 20; flex-direction: column; gap: 10px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.js",
  "three/addons/": "./lib/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="facePanel" class="hidden">
  <h3 class="t">Dị dung — Khuôn mặt</h3><div class="chips" id="faceChips"></div>
  <h3 class="t">Kiểu tóc</h3><div class="chips" id="styleChips"></div>
  <h3 class="t">Màu tóc</h3><div id="hairPalette"></div>
  <div class="small" style="text-align:center;margin-top:6px;opacity:.85">Khi đang đội tóc/nón thời trang, tóc thời trang được ưu tiên (bấm đúp ô Tóc để cởi).</div>
</div>
<div id="toast"></div>
<div id="loading"><div class="t">Đang tải tủ đồ…</div><div id="loadMsg" class="small"></div></div>
<script>
  setTimeout(() => {
    if (!window.wardrobeReady) document.getElementById('loadMsg').textContent =
      'Không tải được thư viện 3D từ internet. Kiểm tra mạng rồi nhấn F5. Hãy mở bằng file XEM_TU_DO.bat.';
  }, 10000);
</script>
<script type="module" src="tu_do.js"></script>
</body>
</html>
